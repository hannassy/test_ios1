name: phoneApp
options:
  bundleIdPrefix: app.local.phoneapp
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.19"

targets:
  phoneApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: phoneApp
        excludes:
          - "**/*.md"
    info:
      path: phoneApp/Info.plist
      properties:
        CFBundleDisplayName: Своё
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        BGTaskSchedulerPermittedIdentifiers:
          - app.local.phoneapp.refresh
        UIBackgroundModes:
          - audio
          - fetch
        NSUserActivityTypes: []
    entitlements:
      path: phoneApp/phoneApp.entitlements
    dependencies:
      - package: ZIPFoundation
      - target: OutageWidget
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.local.phoneapp
        INFOPLIST_FILE: phoneApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: phoneApp/phoneApp.entitlements

  OutageWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OutageWidget
        excludes:
          - "**/*.md"
    info:
      path: OutageWidget/Info.plist
      properties:
        CFBundleDisplayName: Своє світло
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: OutageWidget/OutageWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.local.phoneapp.widget
        INFOPLIST_FILE: OutageWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: OutageWidget/OutageWidget.entitlements

  phoneAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: phoneAppTests
    dependencies:
      - target: phoneApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.local.phoneapp.tests
        INFOPLIST_FILE: phoneAppTests/Info.plist
